<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLACKGLASS</title>
<meta name="description" content="BLACKGLASS — Discover. Analyze. Secure. Authorized website security assessments with real, evidence-based findings.">
<meta name="theme-color" content="#05080c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080c;--s1:#0a1018;--s2:#0e1622;--line:#162032;--tx:#e8edf5;--mu:#8fa0b8;
--ok:#3ddc84;--med:#f5a623;--crit:#ff4d5e;--info:#4a9eff;--f1:'Space Grotesk',system-ui,sans-serif;--f2:'Instrument Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 var(--f2);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f1);font-weight:700;letter-spacing:-.01em}
a{color:var(--info);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono)}
[hidden]{display:none!important}
.mu{color:var(--mu)}

#app{display:flex;min-height:100vh}
aside.rail{width:230px;flex:none;background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3ddc84,#4a9eff);display:grid;place-items:center;color:#05080c;flex:none}
.brand b{font:700 15px var(--f1);display:block;line-height:1.15}
.brand span{font:500 11px var(--mono);color:var(--mu);letter-spacing:.04em}
nav.rnav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
nav.rnav a{color:var(--mu);padding:10px 12px;border-radius:8px;font:500 14px var(--f2);display:flex;align-items:center;gap:10px}
nav.rnav a:hover{color:var(--tx);background:var(--s2);text-decoration:none}
nav.rnav a[aria-current=page]{color:var(--tx);background:var(--s2);border-left:2px solid var(--ok);padding-left:10px}
.rail-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--line)}
.back-link{font-size:13px;color:var(--mu);display:block;margin-bottom:10px}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.user-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.burger{display:none}
@media(max-width:860px){
 aside.rail{position:fixed;left:-240px;z-index:30;transition:left .2s;box-shadow:0 0 0 2000px rgba(0,0,0,0)}
 aside.rail.open{left:0;box-shadow:0 0 0 2000px rgba(0,0,0,.6)}
 .burger{display:grid;position:fixed;top:14px;left:14px;z-index:20;width:40px;height:40px;background:var(--s1);border:1px solid var(--line);border-radius:10px;color:var(--tx);place-items:center}
 main{padding-top:64px!important}
}

main{flex:1;min-width:0;padding:36px 40px 80px}
@media(max-width:700px){main{padding:36px 18px 60px}}
.wrap{max-width:1020px}
.ph{margin-bottom:28px}
.ph h1{font-size:clamp(24px,3vw,32px)}
.ph p{color:var(--mu);margin-top:6px;max-width:60ch}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:760px){.c4,.c6,.c8{grid-column:span 12}}
.box{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:22px}
.box h3{font-size:15px;margin-bottom:12px}
.stat .k{color:var(--mu);font-size:13px}
.stat .v{font:700 30px var(--f1);margin:4px 0}
.stat .v small{font:500 14px var(--f2);color:var(--mu)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px var(--f2);padding:11px 18px;border-radius:9px;border:1px solid var(--line);cursor:pointer;color:var(--tx);background:none;min-height:42px}
.btn:hover{text-decoration:none;border-color:var(--info)}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#042014;font-weight:700}
.btn.primary:hover{background:#4ee997;border-color:#4ee997}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:7px 14px;font-size:13px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.field{margin-bottom:16px}
.field label{display:block;font-weight:500;font-size:14px;margin-bottom:6px}
.field input[type=text],.field input[type=url],.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:11px 13px;font:inherit;min-height:44px}
.field input:focus,.field select:focus{border-color:var(--info);outline:none}
.hint{color:var(--mu);font-size:13px;margin-top:5px}
.err{color:var(--crit);font-size:13px;margin-top:5px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mu)}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--ok);flex:none}
.alert{border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px;border:1px solid}
.alert.er{background:rgba(255,77,94,.08);border-color:#5a2230;color:#ffc4cd}
.alert.ok{background:rgba(61,220,132,.08);border-color:#145032;color:#b6f2d4}
.alert.wn{background:rgba(245,166,35,.08);border-color:#5b4519;color:#f7d9a0}
.alert.in{background:rgba(74,158,255,.08);border-color:#1d3a5e;color:#cfe0ff}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;font-family:var(--mono);text-transform:uppercase;letter-spacing:.03em}
.badge.crit{background:rgba(255,77,94,.14);color:var(--crit)}
.badge.high{background:rgba(255,77,94,.1);color:#ff8c98}
.badge.medium{background:rgba(245,166,35,.14);color:var(--med)}
.badge.low{background:rgba(74,158,255,.14);color:var(--info)}
.badge.informational{background:rgba(143,160,184,.14);color:var(--mu)}
.badge.running{background:rgba(61,220,132,.14);color:var(--ok)}
.badge.completed{background:rgba(61,220,132,.14);color:var(--ok)}
.badge.failed{background:rgba(255,77,94,.14);color:var(--crit)}
.badge.unavailable{background:rgba(143,160,184,.14);color:var(--mu)}
.badge.resolved{background:rgba(61,220,132,.14);color:var(--ok)}

.kv{display:grid;grid-template-columns:140px 1fr;gap:7px 12px;font-size:13.5px}
.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-word}
.reclist{list-style:none;padding:0;display:grid;gap:3px;font-family:var(--mono);font-size:12.5px;word-break:break-all}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-head h3{margin:0}

.learn-card{display:block;text-decoration:none;color:inherit}
.learn-card .lvl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toggle-row button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--tx);font:600 12.5px var(--f2);cursor:pointer}
.toggle-row button.active{background:var(--bl);border-color:var(--bl);color:#fff}
.quiz-opt{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--tx);font:inherit;cursor:pointer;margin-bottom:8px}
.quiz-opt:hover{border-color:var(--bl)}
.quiz-opt.correct{border-color:var(--ok);background:rgba(61,220,132,.1)}
.quiz-opt.wrong{border-color:var(--crit);background:rgba(255,77,94,.1)}
.sim-result{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px}
.sim-result.vuln{background:rgba(255,77,94,.1);border:1px solid #5a2230}
.sim-result.safe{background:rgba(61,220,132,.1);border:1px solid #145032}
.mock-box{background:#05070e;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;margin:10px 0}

.console{background:#020406;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-family:var(--mono);font-size:13px;line-height:1.7;max-height:420px;overflow-y:auto}
.console .ln{color:#9fb0c8;white-space:pre-wrap;word-break:break-word}
.console .ln .t{color:#4a6283}
.console .cursor{display:inline-block;width:7px;height:14px;background:var(--ok);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.flist{list-style:none;padding:0;display:grid;gap:12px}
.fcard{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--s1)}
.fcard .fh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.fcard .fh strong{font:600 15px var(--f1);flex:1 1 auto;min-width:180px}
.fcard dl{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13.5px;margin-top:10px}
.fcard dt{color:var(--mu)}
.fcard dd{margin:0}
.fcard .ep{font-family:var(--mono);font-size:12.5px;word-break:break-all;color:var(--info)}
details.fdetail summary{cursor:pointer;color:var(--info);font-size:13.5px;margin-top:8px}
.statusSel{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:5px 8px;font:500 13px var(--f2)}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--mu);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover{background:var(--s2)}
.empty{color:var(--mu);padding:16px 0}
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(420px,100% - 32px)}
.toast{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:14px}
.toast.er{border-color:#5a2230}.toast.ok{border-color:#145032}
.export-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

@media print {
  aside.rail, .burger, #toasts, .export-bar, .statusSel, details.fdetail summary { display:none !important; }
  details.fdetail > *:not(summary) { display:block !important; }
  body, #app { display:block !important; background:#fff !important; color:#111 !important; }
  main { padding:0 !important; }
  .box, .fcard { background:#fff !important; border-color:#ccc !important; break-inside:avoid; }
  a { color:#111 !important; }
  .console { display:none !important; }
}
</style>
</head>
<body>
<button class="burger" id="burger" aria-label="Menu" hidden>☰</button>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';

/* Same project as BLACKGLASS — shared login and plans. */
const CONFIG = {
  SUPABASE_URL: 'https://kvnzcqtkkguuftrirsew.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2bnpjcXRra2d1dWZ0cmlyc2V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Mzk5MTAsImV4cCI6MjEwNzIxNTkxMH0.vN5ELoWxAtAGDN_4qIPQaQ8mmv4h_G4e5EF4_7MbFt0',
  ACCESS_APP_URL: 'https://hassanchabri.github.io/Nel/',   // BLACKGLASS — where to send users to sign in / buy credits
};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate = d => d ? new Date(d).toLocaleString('en-NG', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- export helpers ---------- */
function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function csvCell(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCsv(rows, headers) {
  const lines = [headers.map(csvCell).join(',')];
  for (const r of rows) lines.push(headers.map(h => csvCell(r[h])).join(','));
  return lines.join('\r\n');
}
function slug(s) { return String(s || 'report').toLowerCase().replace(/^https?:\/\//, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'report'; }

const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const S = { user: null, credits: null };

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

async function callFn(name, body) {
  const { data, error } = await sb.functions.invoke(name, { body });
  if (error) {
    let msg = 'Something went wrong. Try again.';
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch(_) {}
    return { error: msg };
  }
  if (data && data.error) return { error: data.error };
  return { data };
}

/* ---------- routing ---------- */
function route() {
  const q = new URLSearchParams(location.search);
  return { name: q.get('p') || 'dashboard', q };
}
function go(name, params = {}, replace = false) {
  const q = new URLSearchParams({ p: name, ...params });
  history[replace ? 'replaceState' : 'pushState']({}, '', `${location.pathname}?${q}`);
  render();
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-link]');
  if (a && !(e.metaKey || e.ctrlKey || e.shiftKey)) {
    e.preventDefault();
    const u = new URL(a.href); history.pushState({}, '', u.pathname + u.search); render();
    $('aside.rail')?.classList.remove('open');
  }
});
window.addEventListener('popstate', render);

/* ---------- shell ---------- */
function shell(activeName) {
  const u = S.user;
  const NAV = [
    ['dashboard', 'Dashboard'], ['new-scan', 'New Scan'], ['history', 'Scan History'], ['findings', 'All Findings'], ['osint', 'OSINT Recon'], ['learn', 'Learning Lab'],
  ];
  return `<aside class="rail">
   <div class="brand"><i>🛡</i><div><b>BLACKGLASS</b><span>SECURITY SUITE</span></div></div>
   <nav class="rnav">${NAV.map(([p, t]) => `<a href="?p=${p}" data-link ${activeName === p ? 'aria-current="page"' : ''}>${t}</a>`).join('')}</nav>
   <div class="rail-foot">
     <a class="back-link" href="${esc(CONFIG.ACCESS_APP_URL)}">&larr; BLACKGLASS</a>
     <div class="user-chip"><span class="dot"></span><span style="word-break:break-all">${esc(u ? u.email : '')}</span></div>
     <button class="btn sm" id="lo" style="margin-top:10px;width:100%">Log out</button>
   </div>
  </aside>
  <main id="main"><div class="wrap"></div></main>`;
}

/* ---------- auth gate ---------- */
async function requireAuth() {
  const { data } = await sb.auth.getSession();
  S.user = (data.session && data.session.user) || null;
  if (!S.user || !S.user.email_confirmed_at) {
    document.title = 'Sign in required | BLACKGLASS';
    $('#app').innerHTML = `<main style="min-height:100vh;display:grid;place-items:center;padding:40px"><div class="box" style="max-width:420px;text-align:center">
      <h1 style="font-size:24px;margin-bottom:8px">Sign in required</h1>
      <p class="mu" style="margin-bottom:20px">This uses your BLACKGLASS account. Sign in, then come back here.</p>
      <a class="btn primary block" href="${esc(CONFIG.ACCESS_APP_URL)}?p=login">Go to login</a>
    </div></main>`;
    return false;
  }
  return true;
}

async function getCredits() {
  const { data } = await sb.rpc('my_lab_credits');
  S.credits = (data && data[0]) || { free_scan_used: false, paid_credits: 0 };
  return S.credits;
}

/* ---------- pages ---------- */
const PAGES = {};

PAGES.dashboard = {
  title: 'Dashboard',
  load: async () => {
    const [credits, scans] = await Promise.all([
      getCredits(),
      sb.from('lab_scans').select('id,status,started_at,finished_at,credits_charged,profile,lab_targets(url)').order('started_at', { ascending: false }).limit(5)
    ]);
    const { data: findings } = await sb.from('lab_findings').select('severity');
    const sevCount = { critical: 0, high: 0, medium: 0, low: 0, informational: 0 };
    (findings || []).forEach(f => sevCount[f.severity] = (sevCount[f.severity] || 0) + 1);
    return { credits, scans: scans.data || [], sevCount };
  },
  html: ({ credits, scans, sevCount }) => {
    const canScan = !credits.free_scan_used || credits.paid_credits > 0;
    return `<div class="ph"><h1>Discover. Analyze. Secure.</h1><p>Your authorized website security assessments, in one place.</p></div>
    <div class="grid">
     <div class="box c4 stat"><div class="k">Scan availability</div>
       <div class="v" style="font-size:20px">${!credits.free_scan_used ? 'Free scan ready' : credits.paid_credits > 0 ? credits.paid_credits + ' credits' : 'No scans left'}</div>
       <p class="hint">${!credits.free_scan_used ? 'Your one free scan has not been used yet.' : credits.paid_credits > 0 ? 'Deducted after each scan by finding severity.' : 'Buy a credit pack on BLACKGLASS to continue.'}</p>
       ${canScan ? '<a class="btn primary block" href="?p=new-scan" data-link style="margin-top:12px">Start a scan</a>' : `<a class="btn block" href="${esc(CONFIG.ACCESS_APP_URL)}?p=pricing" style="margin-top:12px">Buy credits</a>`}</div>
     <div class="box c4 stat"><div class="k">Total assessments</div><div class="v">${scans.length ? scans.length : 0}${scans.length === 5 ? '+' : ''}</div><p class="hint">Shown: your most recent scans.</p></div>
     <div class="box c4"><h3 style="margin-bottom:10px">Findings by severity</h3>
       ${['critical','high','medium','low','informational'].map(s => sevCount[s] ? `<div style="display:flex;justify-content:space-between;padding:4px 0"><span class="badge ${s}">${s}</span><span class="mono">${sevCount[s]}</span></div>` : '').join('') || '<p class="hint">No findings yet.</p>'}</div>
     <div class="box c12"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Recent activity</h3><a href="?p=history" data-link style="font-size:13px">View all</a></div>
      ${scans.length ? `<table class="tbl"><thead><tr><th>Target</th><th>Profile</th><th>Status</th><th>Date</th></tr></thead><tbody>
        ${scans.map(s => `<tr class="clk" data-link data-go="scan-report&id=${s.id}"><td class="mono" style="word-break:break-all">${esc((s.lab_targets||{}).url || '—')}</td><td>${esc(s.profile)}</td><td><span class="badge ${s.status}">${esc(s.status)}</span></td><td>${fdate(s.started_at)}</td></tr>`).join('')}
      </tbody></table>` : '<p class="empty">No scans yet. Start your first one above.</p>'}</div>
    </div>`;
  },
  mount: () => { bindRowLinks(); }
};

function bindRowLinks() {
  document.querySelectorAll('tr[data-go]').forEach(tr => {
    tr.addEventListener('click', () => { const [p, qs] = tr.dataset.go.split('&'); const params = Object.fromEntries(new URLSearchParams(qs)); go(p, params); });
  });
}

PAGES['new-scan'] = {
  title: 'New Scan',
  load: () => getCredits(),
  html: credits => {
    const canScan = !credits.free_scan_used || credits.paid_credits > 0;
    return `<div class="ph"><h1>Start a new scan</h1><p>Passive scans read public responses only. Standard and Advanced add non-destructive checks for exposure and misconfiguration. Nothing here attempts exploitation, credential theft, or denial of service.</p></div>
    ${!canScan ? `<div class="alert wn">You don't have a scan available. ${credits.free_scan_used ? 'Buy a credit pack on BLACKGLASS to run another scan.' : ''}</div>` : ''}
    <div class="box" style="max-width:600px">
     <form id="f">
      <div class="alert er form-error" role="alert" hidden></div>
      <div class="field"><label for="url">Target URL</label><input id="url" name="url" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://example.com" ${canScan ? '' : 'disabled'}><div class="err" id="eurl"></div></div>
      <div class="field"><label for="label">Label (optional)</label><input id="label" name="label" type="text" maxlength="120" placeholder="e.g. Staging site" ${canScan ? '' : 'disabled'}></div>
      <div class="field"><label for="profile">Scan profile</label>

async function playConsole(lines) {
  const box = $('#console'); if (!box) return;
  for (const line of lines) {
    const m = line.match(/^(\S+)\s(.*)$/);
    const row = document.createElement('div'); row.className = 'ln';
    row.innerHTML = `<span class="t">${esc((m ? m[1] : '').split('T')[1]?.slice(0,8) || '')}</span> ${esc(m ? m[2] : line)}`;
    box.appendChild(row); box.scrollTop = box.scrollHeight;
    await sleep(90);
  }
  const cur = document.createElement('span'); cur.className = 'cursor'; box.appendChild(cur);
}

function sectionBadge(section) {
  if (!section) return '<span class="badge unavailable">unavailable</span>';
  return section.status === 'ok' ? '<span class="badge ok">available</span>' : `<span class="badge unavailable">unavailable</span>`;
}

function dnsBlock(dns) {
  if (!dns || !dns.data) return '<p class="hint">No DNS data.</p>';
  const order = ['A', 'AAAA', 'MX', 'NS', 'TXT', 'CAA', 'SOA'];
  const rows = order.filter(t => dns.data[t] && dns.data[t].length);
  if (!rows.length) return '<p class="hint">No records found.</p>';
  return `<dl class="kv">${rows.map(t => `<dt>${t}</dt><dd><ul class="reclist">${dns.data[t].map(v => `<li>${esc(v)}</li>`).join('')}</ul></dd>`).join('')}</dl>`;
}

function rdapBlock(rdap) {
  if (!rdap || rdap.status !== 'ok' || !rdap.data) return `<p class="hint">${esc((rdap && rdap.reason) || 'Not available.')}</p>`;
  const d = rdap.data;
  return `<dl class="kv">
   <dt>Registrar</dt><dd>${esc(d.registrar || '—')}</dd>
   <dt>Registered</dt><dd>${fdate(d.registered)}</dd>
   <dt>Last changed</dt><dd>${fdate(d.last_changed)}</dd>
   <dt>Expires</dt><dd>${fdate(d.expires)}</dd>
   <dt>Status</dt><dd>${(d.status || []).map(esc).join(', ') || '—'}</dd>
   <dt>Nameservers</dt><dd>${(d.nameservers || []).map(esc).join(', ') || '—'}</dd>
  </dl>`;
}

function certsBlock(certs) {
  if (!certs || certs.status !== 'ok' || !certs.data) return `<p class="hint">${esc((certs && certs.reason) || 'Not available.')}</p>`;
  return `<p>${certs.data.count} certificate record${certs.data.count === 1 ? '' : 's'} found in public certificate-transparency logs.</p>`;
}

function subdomainsBlock(sub) {
  if (!sub || sub.status !== 'ok' || !sub.data || !sub.data.length) return `<p class="hint">${esc((sub && sub.reason) || 'No subdomains found.')}</p>`;
  return `<table class="tbl"><thead><tr><th>Name</th><th>Status</th></tr></thead><tbody>
   ${sub.data.map(s => `<tr><td class="mono" style="word-break:break-all">${esc(s.name)}</td><td>${s.resolved === true ? '<span class="badge resolved">resolves</span>' : s.resolved === false ? '<span class="badge unavailable">not confirmed</span>' : '<span class="hint">not probed</span>'}</td></tr>`).join('')}
  </tbody></table>`;
}

function securityContactBlock(sc) {
  if (!sc || sc.status !== 'ok' || !sc.data) return `<p class="hint">${esc((sc && sc.reason) || 'No security.txt found.')}</p>`;
  return `<p class="hint" style="margin-bottom:8px">Found at <span class="mono">${esc(sc.data.url)}</span></p>
   ${sc.data.contacts.length ? `<ul class="reclist">${sc.data.contacts.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : '<p class="hint">No Contact: lines found.</p>'}`;
}

    const ORDERS = { '5001': { owner: 1001, item: 'USB cable', total: '$6.50' }, '5002': { owner: 1002, item: 'Laptop stand', total: '$42.00' }, '5003': { owner: 1003, item: 'Webcam', total: '$29.99' } };
    let mode = 'vuln';
    document.querySelectorAll('.toggle-row button').forEach(b => b.onclick = () => {
      document.querySelectorAll('.toggle-row button').forEach(x => x.classList.remove('active')); b.classList.add('active'); mode = b.dataset.m;
    });
    $('#ogo').onclick = () => {
      const id = $('#oid').value.trim();
      const order = ORDERS[id];
      if (!order) { $('#oresult').innerHTML = `<div class="sim-result safe">No such order.</div>`; return; }
      const mine = order.owner === 1001;
      if (mode === 'vuln' || mine) {
        $('#oresult').innerHTML = `<div class="mock-box">Order #${esc(id)}: ${esc(order.item)} — ${esc(order.total)} (belongs to customer #${order.owner})</div>` +
          (!mine ? `<div class="sim-result vuln"><b>You just viewed someone else's order.</b><br>The endpoint trusted the ID in the URL and never checked it belonged to the logged-in user — an Insecure Direct Object Reference (IDOR).<br><br><b>Fix:</b> always check that the requested resource's owner matches the authenticated user, server-side.</div>`
                     : `<div class="sim-result safe">That's your own order — no issue here.</div>`);
      } else {
        $('#oresult').innerHTML = `<div class="sim-result safe">403 Forbidden — the fixed version checks that order #${esc(id)} belongs to customer #1001 before returning it.</div>`;
      }
    };
  }
};

LEARN.auth = {
  html: () => `<div class="box" style="max-width:560px">
    <p class="hint" style="margin-bottom:10px">Type a password to see a rough crack-time estimate, then try the brute-force simulation below.</p>
    <div class="field"><label>Password</label><input id="pw" type="text"></div>
    <div id="pwresult"></div>
    <hr style="border-color:var(--line);margin:20px 0">
    <div class="toggle-row"><button class="active" data-m="off">No rate limiting</button><button data-m="on">Rate limited (5 tries)</button></div>
    <button class="btn primary" id="bgo">Simulate 20 login attempts against "P@ssw0rd"</button>
    <div id="bresult"></div>
   </div>`,
  mount: () => {
    const show = () => {
      const v = $('#pw').value;
      let pool = 0;
      if (/[a-z]/.test(v)) pool += 26; if (/[A-Z]/.test(v)) pool += 26; if (/\d/.test(v)) pool += 10; if (/[^a-zA-Z0-9]/.test(v)) pool += 32;
      const entropy = v.length * Math.log2(pool || 1);
      const guesses = Math.pow(2, entropy) / 2;
      const seconds = guesses / 1e10; // ~10B guesses/sec, a realistic offline GPU cracking rate
      let human = seconds < 1 ? 'instantly' : seconds < 60 ? `${seconds.toFixed(1)}s` : seconds < 3600 ? `${(seconds / 60).toFixed(1)} min` : seconds < 86400 * 365 ? `${(seconds / 86400).toFixed(1)} days` : `${(seconds / (86400 * 365)).toExponential(1)} years`;
      $('#pwresult').innerHTML = v ? `<p class="hint">Estimated offline crack time (rough, GPU-class attacker): <b>${human}</b></p>` : '';
    };
    $('#pw').oninput = show;
    let limited = false;
    document.querySelectorAll('.toggle-row button').forEach(b => b.onclick = () => {
      document.querySelectorAll('.toggle-row button').forEach(x => x.classList.remove('active')); b.classList.add('active'); limited = b.dataset.m === 'on';
    });
    $('#bgo').onclick = () => {
      let tried = 0, locked = false, found = false;
      const log = [];
      for (let i = 1; i <= 20; i++) {
        if (limited && tried >= 5) { locked = true; log.push(`Attempt ${i}: blocked — account locked after 5 failed attempts`); continue; }
        tried++;
        const guess = i === 17 ? 'P@ssw0rd' : `guess${i}`;
        if (guess === 'P@ssw0rd') { found = true; log.push(`Attempt ${i}: "${guess}" — correct!`); if (!limited) break; }
        else log.push(`Attempt ${i}: "${guess}" — rejected`);
      }
      $('#bresult').innerHTML = `<div class="mock-box">${log.join('\n')}</div>` +
        (found
          ? `<div class="sim-result vuln"><b>Password found by brute force.</b><br>With no rate limiting, an attacker can try unlimited passwords automatically.<br><br><b>Fix:</b> lock or throttle accounts after a handful of failed attempts, and require multi-factor authentication.</div>`
          : `<div class="sim-result safe">Rate limiting stopped the attack before the correct password was reached.</div>`);
    };
  }
};

LEARN.headers = {
  html: () => {
    const opts = [
      ['hsts', 'Strict-Transport-Security'], ['csp', 'Content-Security-Policy'], ['xcto', 'X-Content-Type-Options'],
      ['xfo', 'X-Frame-Options'], ['rp', 'Referrer-Policy'],
    ];
    return `<div class="box" style="max-width:560px">
     <p class="hint" style="margin-bottom:10px">Check the headers you think a hardened site response should include, then score it.</p>
     ${opts.map(([id, name]) => `<label class="check" style="display:block;margin-bottom:8px"><input type="checkbox" id="h_${id}"><span class="mono">${name}</span></label>`).join('')}
     <button class="btn primary" id="hgo" style="margin-top:10px">Score my response</button>
     <div id="hresult"></div>
    </div>`;
  },
  mount: () => {
    const opts = ['hsts', 'csp', 'xcto', 'xfo', 'rp'];
    $('#hgo').onclick = () => {
      const checked = opts.filter(id => $('#h_' + id).checked);
      const missing = opts.filter(id => !$('#h_' + id).checked);
      const names = { hsts: 'Strict-Transport-Security', csp: 'Content-Security-Policy', xcto: 'X-Content-Type-Options', xfo: 'X-Frame-Options', rp: 'Referrer-Policy' };
      $('#hresult').innerHTML = missing.length
        ? `<div class="sim-result vuln"><b>${checked.length}/${opts.length} selected.</b><br>Missing: ${missing.map(m => names[m]).join(', ')}.<br>Every one of these is a real header the scanner itself checks for on your live scans.</div>`
        : `<div class="sim-result safe"><b>All five selected.</b> That's the same baseline set this platform's scanner checks for on every standard/advanced scan.</div>`;
    };
  }
};

LEARN.validation = {
  html: () => `<div class="box" style="max-width:560px">
    <p class="hint" style="margin-bottom:10px">This mock "upload a profile picture" field only checks the file extension in the name — a very common, broken validation shortcut. Try to slip something past it.</p>
    <div class="field"><label>Filename</label><input id="fn" type="text" placeholder="photo.jpg"></div>
    <button class="btn primary" id="fgo">Upload</button>
    <div id="fresult"></div>
   </div>`,
  mount: () => {
    $('#fgo').onclick = () => {
      const name = $('#fn').value.trim();
      const looksImage = /\.(jpe?g|png|gif)$/i.test(name);
      const hasDoubleExt = /\.(php|phtml|asp|aspx|jsp|exe|sh)\.?(jpe?g|png|gif)?$/i.test(name) || /\.(php|phtml|asp|aspx|jsp|exe|sh)$/i.test(name.split('.').slice(0, -1).join('.') + '.x');
      const nullByteOrTraversal = name.includes('../') || name.includes('..\\') || name.includes('%00');
      const accepted = looksImage || (/\.(php|phtml|asp|aspx|jsp)\./i.test(name));
      if (nullByteOrTraversal) {
        $('#fresult').innerHTML = `<div class="sim-result vuln"><b>Path traversal characters accepted.</b><br>A validator that only checks the extension does nothing to stop "../" sequences that write outside the intended folder.<br><br><b>Fix:</b> strip/reject path separators, generate your own filename server-side, and never trust the client-supplied name for storage paths.</div>`;
      } else if (/\.(php\d?|phtml|asp|aspx|jsp)\.(jpe?g|png|gif)$/i.test(name)) {
        $('#fresult').innerHTML = `<div class="sim-result vuln"><b>Uploaded as "${esc(name)}" — accepted.</b><br>Extension-only checks are easily bypassed with a double extension; depending on server config, this file could still execute as code.<br><br><b>Fix:</b> validate the actual file content (magic bytes), store uploads outside the web root, and serve them with a content-type that can't execute.</div>`;
      } else if (looksImage) {
        $('#fresult').innerHTML = `<div class="sim-result safe">Accepted as a normal image — no issue demonstrated with this filename. Try something like <span class="mono">shell.php.jpg</span> or <span class="mono">../../config.php</span>.</div>`;
      } else {
        $('#fresult').innerHTML = `<div class="sim-result safe">Rejected — doesn't look like an image and didn't match a known bypass pattern either.</div>`;
      }
    };
  }
};

/* ---------- render ---------- */
let renderTok = 0;
async function render() {
  const tok = ++renderTok;
  const ok = await requireAuth();
  if (!ok) return;
  const { name, q } = route(), def = PAGES[name] || PAGES.dashboard;
  document.title = `${def.title} | BLACKGLASS`;
  $('#app').innerHTML = shell(name);
  $('#burger').hidden = false;
  $('#burger').onclick = () => $('aside.rail').classList.toggle('open');
  $('#lo').onclick = async () => { await sb.auth.signOut(); location.href = CONFIG.ACCESS_APP_URL; };
  const wrap = $('#main .wrap');
  wrap.innerHTML = `<div style="padding:60px 0;text-align:center;color:var(--mu)"><span class="spin"></span></div>`;
  let data;
  try { data = def.load ? await def.load(q) : undefined; }
  catch (e) { if (tok !== renderTok) return; wrap.innerHTML = `<div class="box"><h1>Couldn't load this page</h1><p class="mu">Check your connection and try again.</p></div>`; return; }
  if (tok !== renderTok) return;
  wrap.innerHTML = def.html(data, q);
  if (def.mount) def.mount(data, q);
}

(async function init() {
  sb.auth.onAuthStateChange(() => {});
  render();
})();
})();
